# Python 类型检查入口 (mypy)。跑法:
#   .venv\Scripts\python.exe -m mypy
# 不带参数就按本文件的 files 全量检查; 只查包用 .venv\Scripts\python.exe -m mypy minicpm_jev
#
# strict 里含 warn_unused_ignores, 所以 type: ignore 必须把错误码写全 (裸 ignore 会反过来报错)。
# 第三方依赖 (llama_cpp / numpy / fastapi / pydantic / pytest) 都带 py.typed, 因此故意不开
# ignore_missing_imports: 哪天某个依赖没了 stub, 这里会直接报 import-untyped 而不是静默放行。

[mypy]
files = minicpm_jev, tests, examples, scripts
python_version = 3.11
strict = True
plugins = pydantic.mypy

# 第三方库里没标注的函数 (llama_cpp 的 _internals 绑定层): 调用点逐个写了
# type: ignore[no-untyped-call], 不需要在这里放宽整条规则。
